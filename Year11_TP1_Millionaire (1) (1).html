<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 11 TP1 Millionaire</title><style>body{margin:0;font-family:Arial;background:linear-gradient(#001a4d,#000);color:#fff}.container{max-width:1200px;margin:auto;padding:20px}h1{text-align:center;color:gold}.main{display:grid;grid-template-columns:2fr 1fr;gap:20px}.box,.side{background:#062b78;padding:20px;border-radius:18px}.side{background:#111}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:14px;border:none;border-radius:10px;background:#1846b8;color:#fff;cursor:pointer}.btn:hover{background:gold;color:#000}.current{background:gold!important;color:#000}.lifelines button{margin-right:10px;padding:10px}.correct{background:green!important}.wrong{background:red!important}</style></head><body><div class="container"><h1>Who Wants To Be A Millionaire? Year 11 TP1</h1><div class="lifelines"><button onclick="fifty()">50:50</button><button onclick="audience()">Ask Audience</button><button onclick="friend()">Phone a Friend</button></div><div class="main"><div class="box"><h2 id="money">£0</h2><h3 id="question"></h3><div id="answers" class="answers"></div></div><div class="side"><div id="ladder"></div></div></div></div><script>const prizes=['£100','£200','£300','£500','£1,000','£2,000','£4,000','£8,000','£16,000','£32,000','£64,000','£125,000','£250,000','£500,000','£1,000,000'];const questions=[{question:'What does the word Pentecost mean?',answers:['Resurrection','Fiftieth','Harvest','Apostle'],correct:1},{question:'Who preached to the crowds on the day of Pentecost?',answers:['Paul','Patrick','Peter','James'],correct:2},{question:'Which member of the Trinity descended upon the Apostles at Pentecost?',answers:['God the Father','Jesus','The Holy Spirit','Moses'],correct:2},{question:'How many days after Easter is Pentecost celebrated?',answers:['7','40','50','70'],correct:2},{question:'Which type of Church Government is used by the Catholic Church?',answers:['Congregational','Representative','Episcopal','Democratic'],correct:2},{question:'Which of these was NOT a sign at Pentecost?',answers:['Mighty Wind','Tongues of Fire','Speaking in Tongues','Earthquake'],correct:3},{question:'Why did St Paul say spiritual gifts are given?',answers:['To make Christians important','To benefit everyone','To make money','To gain status'],correct:1},{question:'Which is a spiritual gift?',answers:['Wealth','Wisdom','Authority','Popularity'],correct:1},{question:'St Paul compared the Church to a?',answers:['Eye','Head','Body','Heart'],correct:2},{question:'Which is NOT a characteristic of the Early Church?',answers:['Prayer','Sharing','Pilgrimage','Hymn Singing'],correct:2},{question:'Who are successors of the Apostles?',answers:['Priests','Cardinals','College of Bishops','Deacons'],correct:2},{question:'What is Papal Infallibility?',answers:['Pope cannot sin','Pope always right','Without error on faith and morals','Cannot retire'],correct:2},{question:'Why is Pentecost the Birthday of the Church?',answers:['Jesus born','Buildings built','Church mission began','Peter became Pope'],correct:2},{question:'Why does the Pope have unique leadership?',answers:['Lives in Rome','Elected by Cardinals','Successor of St Peter','Oldest bishop'],correct:2},{question:'Which statement best supports Church unity?',answers:['Stay separate','One body, same Spirit','Disagree on doctrine','Tradition above unity'],correct:1}];let c=0,u50=false,ua=false,uf=false;function draw(){question.innerText=questions[c].question;answers.innerHTML='';questions[c].answers.forEach((a,i)=>{let b=document.createElement('button');b.className='btn';b.innerText=a;b.onclick=()=>ans(i,b);answers.appendChild(b)});ladder.innerHTML='';for(let i=14;i>=0;i--){let d=document.createElement('div');d.className=i===c?'current':'';d.style.padding='6px';d.innerText=prizes[i];ladder.appendChild(d)}}function ans(i,b){let cor=questions[c].correct;if(i===cor){money.innerText=prizes[c];b.classList.add('correct');setTimeout(()=>{if(c===14){document.body.innerHTML='<h1 style="text-align:center">🎉 YOU ARE A MILLIONAIRE! 🎉<br>'+prizes[14]+'</h1>'}else{c++;draw()}},800)}else{b.classList.add('wrong');setTimeout(()=>{document.body.innerHTML='<h1 style="text-align:center">Game Over<br>You won '+(c>=10?'£32,000':c>=5?'£1,000':'£0')+'</h1>'},1000)}}function fifty(){if(u50)return;u50=true;let cor=questions[c].correct;let btns=[...document.querySelectorAll('.btn')].filter((x,i)=>i!==cor);btns.sort(()=>Math.random()-.5);btns[0].style.visibility='hidden';btns[1].style.visibility='hidden'}function audience(){if(ua)return;ua=true;alert('Audience thinks answer '+String.fromCharCode(65+questions[c].correct))}function friend(){if(uf)return;uf=true;alert('Your friend suggests answer '+String.fromCharCode(65+questions[c].correct))}draw();</script></body></html>
